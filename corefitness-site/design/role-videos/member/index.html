<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=540, height=1170" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/pieces.css" />
    <style>
      html, body { width: 540px; height: 1170px; }
      #code { left: 50px; top: 150px; width: 440px; text-align: center; }
      #code img { display: block; width: 300px; height: 300px; margin: 4px auto 16px; border-radius: 22px; }
      #code .lab { margin: 0; }
      #visits { left: 50px; top: 700px; width: 440px; }
      #set { left: 26px; top: 170px; width: 488px; }
      .set { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 2px solid rgba(255,255,255,0.07); font-size: 29px; }
      .set > span { width: 92px; color: #b3a5c6; font-size: 25px; }
      .set b { flex: 1; font-size: 31px; }
      .done-box { position: relative; overflow: hidden; width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; border: 2px solid rgba(255,255,255,0.2); }
      .done-box.on { background: #7c3aed; border-color: #7c3aed; }
      #pr { left: 26px; top: 640px; width: 488px; }
      .medal { flex: none; width: 64px; height: 64px; border-radius: 50%; background: #f5a524; display: grid; place-items: center; }
      #tapdot { position: absolute; left: 0; top: 0; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" class="phone" data-composition-id="member" data-start="0" data-duration="8" data-fps="30" data-width="540" data-height="1170">
      <!-- The real Core Fitness Lab member app, demo records. -->
      <img id="screen" class="clip" src="assets/member.png" alt="" data-start="0" data-duration="8" data-track-index="0" />
      <div id="tap-host" class="clip" data-start="0" data-duration="8" data-track-index="1"><i id="tapdot"></i></div>
      <div id="dim" class="clip" data-start="0" data-duration="8" data-track-index="2"><i></i></div>

      <div id="checkin-host" class="clip" data-start="0" data-duration="8" data-track-index="3">
        <div id="code" class="card">
          <div class="card-head">Check in</div>
          <img src="assets/qr.svg" alt="" />
          <span class="lab">Premium · valid to Dec 7</span>
        </div>
        <div id="visits" class="chip"><span class="tick"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><b>Checked in</b><span id="vc">0 visits in Nov</span></div></div>
      </div>

      <div id="workout-host" class="clip" data-start="0" data-duration="8" data-track-index="4">
        <div id="set" class="card">
          <div class="card-head">Bench press</div>
          <div class="set" id="s1"><span>Set 1</span><b>40 kg × 8</b><span class="done-box on"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <div class="set" id="s2"><span>Set 2</span><b>40 kg × 8</b><span class="done-box on"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <div class="set" id="s3"><span>Set 3</span><b>42.5 kg × 8</b><span class="done-box" id="box3"><svg id="tick3" width="28" height="28" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><i class="ripple" id="rip"></i></span></div>
        </div>
        <div id="pr" class="chip"><span class="medal"><svg width="32" height="32" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" fill="#1a1206"/></svg></span><div><b>New record · Bench press</b><span>42.5 kg × 8</span></div></div>
      </div>

      <div id="cursor-host" class="clip" data-start="0" data-duration="8" data-track-index="5">
        <svg id="cursor" width="52" height="62" viewBox="0 0 22 26"><path d="M2 2l17 12-7.5 1.2L15.5 23l-3.4 1.5-3.6-7.8L2 21.5z" fill="#fff" stroke="#17121e" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const b = document.getElementById('box3').getBoundingClientRect();
      const t3 = { x: b.left + b.width * 0.5 - 4, y: b.top + b.height * 0.55 - 4 };
      const checkBtn = { x: 460, y: 1128 }; // the real Check in button on the capture (430 px wide, scaled to 540)
      const pop = { scale: 0.6, opacity: 0, transformOrigin: '50% 60%' };
      const popTo = { scale: 1, opacity: 1, duration: 0.42, ease: 'back.out(1.7)' };
      const text = (id, value) => { document.getElementById(id).textContent = value; };

      // The member taps the app's own Check in button; their code opens.
      tl.fromTo('#cursor', { x: 300, y: 1000, opacity: 0 }, { x: 300, y: 1000, opacity: 1, duration: 0.01 }, 0.25);
      tl.to('#cursor', { x: checkBtn.x - 4, y: checkBtn.y - 4, duration: 0.55, ease: 'power2.inOut' }, 0.3);
      tl.to('#cursor', { scale: 0.86, duration: 0.08, yoyo: true, repeat: 1 }, 0.88);
      tl.fromTo('#tapdot', { x: checkBtn.x, y: checkBtn.y, scale: 0, opacity: 0.5 }, { x: checkBtn.x, y: checkBtn.y, scale: 1.6, opacity: 0, duration: 0.45, ease: 'power2.out' }, 0.9);
      tl.fromTo('#dim i', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 1.0);
      tl.fromTo('#code', pop, popTo, 1.1);
      tl.to('#cursor', { x: 440, y: 1040, duration: 0.5, ease: 'power2.inOut' }, 1.3);
      // The desk scans it: the visit counts.
      tl.fromTo('#visits', pop, popTo, 2.2);
      const f = { v: 0 };
      tl.to(f, { v: 1, duration: 0.02, onUpdate() { text('vc', f.v > 0.5 ? '1 visit in Nov' : '0 visits in Nov'); } }, 2.7);
      tl.fromTo('#vc', { color: '#b3a5c6' }, { color: '#f5a524', duration: 0.15, yoyo: true, repeat: 1 }, 2.7);
      // Later, the workout: sets stack in, the last one is ticked, the database finds a record.
      tl.to(['#code', '#visits'], { scale: 0.85, opacity: 0, y: -30, duration: 0.28, stagger: 0.06, ease: 'power2.in' }, 3.4);
      tl.fromTo('#set', pop, popTo, 3.7);
      tl.fromTo(['#s1', '#s2', '#s3'], { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, stagger: 0.2, ease: 'back.out(1.4)' }, 3.9);
      tl.set('#tick3', { opacity: 0 }, 0);
      tl.to('#cursor', { x: t3.x, y: t3.y, duration: 0.6, ease: 'power2.inOut' }, 4.4);
      tl.to('#cursor', { scale: 0.86, duration: 0.08, yoyo: true, repeat: 1 }, 5.02);
      tl.fromTo('#rip', { scale: 0, opacity: 0.6 }, { scale: 2.6, opacity: 0, duration: 0.45, ease: 'power2.out' }, 5.04);
      tl.fromTo('#box3', { backgroundColor: 'rgba(124,58,237,0)', borderColor: 'rgba(255,255,255,0.2)' }, { backgroundColor: 'rgba(124,58,237,1)', borderColor: 'rgba(124,58,237,1)', duration: 0.15 }, 5.08);
      tl.to('#tick3', { opacity: 1, duration: 0.15 }, 5.1);
      tl.fromTo('#pr', pop, popTo, 5.35);
      tl.to('#cursor', { x: t3.x - 120, y: t3.y + 420, duration: 0.6, ease: 'power2.inOut' }, 5.5);
      // Resolve back into the screen.
      tl.to('#cursor', { opacity: 0, duration: 0.25 }, 6.4);
      tl.to('#pr', { y: -360, scale: 0.5, opacity: 0, duration: 0.42, ease: 'power2.in' }, 6.5);
      tl.to('#set', { y: 120, scale: 0.75, opacity: 0, duration: 0.45, ease: 'power2.in' }, 6.6);
      tl.to('#dim i', { opacity: 0, duration: 0.45, ease: 'power2.inOut' }, 7.0);
      window.__timelines['member'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

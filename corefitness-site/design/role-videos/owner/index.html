<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=900" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/pieces.css" />
    <style>
      html, body { width: 1440px; height: 900px; }
      #needs { left: 70px; top: 80px; width: 700px; }
      #stats { left: 70px; top: 78px; width: max-content; }
      #watch { left: 70px; top: 150px; width: 600px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="owner" data-start="0" data-duration="8" data-fps="30" data-width="1440" data-height="900">
      <!-- The real Core Fitness Lab dashboard, demo records. -->
      <img id="screen" class="clip" src="assets/dashboard.png" alt="" data-start="0" data-duration="8" data-track-index="0" />
      <div id="dim" class="clip" data-start="0" data-duration="8" data-track-index="1"><i></i></div>

      <div id="stats-host" class="clip" data-start="0" data-duration="8" data-track-index="2">
        <div id="stats" class="card">
          <div class="card-head">The day so far</div>
          <div class="stat-row">
            <div class="stat" id="s1"><span class="lab">Checked in today</span><b class="num" id="n-in">0</b></div>
            <div class="stat" id="s2"><span class="lab">Cash today</span><b class="num" id="n-cash">₱0</b></div>
            <div class="stat" id="s3"><span class="lab">Classes</span><b class="num">2 of 3</b><span class="sub">still to come</span></div>
          </div>
        </div>
      </div>

      <div id="needs-host" class="clip" data-start="0" data-duration="8" data-track-index="3">
        <div id="needs" class="card">
          <div class="card-head">Needs you <em id="todo">11 to do</em></div>
          <div class="row" id="r1"><i class="dot"></i><div><b>2 bookings to decide</b><span>oldest waiting 2 days</span></div><span class="btn">Review</span></div>
          <div class="row" id="r2"><i class="dot"></i><div><b id="r2t">3 sign-ups waiting</b><span>Andrea S., Carlo B., +1</span></div><span class="btn amber" id="approve">Approve<i class="ripple" id="rip"></i></span></div>
          <div class="row" id="r3"><i class="dot"></i><div><b>2 online payments to confirm</b><span>GCash · ₱2,300</span></div><span class="btn">Confirm</span></div>
        </div>
      </div>

      <div id="watch-host" class="clip" data-start="0" data-duration="8" data-track-index="4">
        <div id="watch" class="chip">
          <span class="av">RS</span><div><b>Rhea Santos</b><span>membership ends in 4 days</span></div><em class="tag">High</em>
        </div>
      </div>

      <div id="cursor-host" class="clip" data-start="0" data-duration="8" data-track-index="5">
        <svg id="cursor" width="44" height="52" viewBox="0 0 22 26"><path d="M2 2l17 12-7.5 1.2L15.5 23l-3.4 1.5-3.6-7.8L2 21.5z" fill="#fff" stroke="#17121e" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Measured once, before any tween transforms a piece: where the cursor's tip must land.
      const box = document.getElementById('approve').getBoundingClientRect();
      const tap = { x: box.left + box.width * 0.45, y: box.top + box.height * 0.55 };
      const pop = { scale: 0.6, opacity: 0, transformOrigin: '50% 60%' };
      const popTo = { scale: 1, opacity: 1, duration: 0.42, ease: 'back.out(1.7)' };
      // Rest, then the screen dims so the pieces read as the subject.
      tl.fromTo('#dim i', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.out' }, 0.5);
      // The day so far: card pops, its three numbers count up from zero.
      tl.fromTo('#stats', pop, popTo, 0.8);
      tl.fromTo(['#s1', '#s2', '#s3'], { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.12, ease: 'power2.out' }, 1.0);
      const n = { a: 0, b: 0 };
      tl.to(n, { a: 18, b: 4350, duration: 1.3, ease: 'power2.out', onUpdate() {
        document.getElementById('n-in').textContent = Math.round(n.a);
        document.getElementById('n-cash').textContent = '₱' + Math.round(n.b).toLocaleString('en-US');
      } }, 1.05);
      // Needs you: the card, then each row pops in.
      tl.to('#stats', { scale: 0.85, opacity: 0, y: -30, duration: 0.28, ease: 'power2.in' }, 2.3);
      tl.fromTo('#needs', pop, popTo, 2.5);
      tl.fromTo(['#r1', '#r2', '#r3'], { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, stagger: 0.22, ease: 'back.out(1.4)' }, 2.7);
      // The cursor glides in and taps Approve.
      tl.fromTo('#cursor', { x: 1150, y: 860, opacity: 0 }, { x: 1150, y: 860, opacity: 1, duration: 0.01 }, 3.4);
      tl.to('#cursor', { x: tap.x - 4, y: tap.y - 4, duration: 0.75, ease: 'power2.inOut' }, 3.45);
      tl.to('#cursor', { scale: 0.86, duration: 0.08, yoyo: true, repeat: 1, ease: 'power1.inOut' }, 4.22);
      tl.to('#approve', { scale: 0.93, duration: 0.07, yoyo: true, repeat: 1, ease: 'power1.inOut' }, 4.2);
      tl.fromTo('#rip', { scale: 0, opacity: 0.55 }, { scale: 3.2, opacity: 0, duration: 0.45, ease: 'power2.out' }, 4.24);
      tl.to('#rip', { scale: 0, duration: 0.01 }, 4.72);
      // The tap lands: the row reads approved and the count drops (a flag tween, so seeking either way is right).
      const flag = { v: 0 };
      tl.to(flag, { v: 1, duration: 0.02, onUpdate() {
        const done = flag.v > 0.5;
        document.getElementById('r2t').textContent = done ? '3 sign-ups approved' : '3 sign-ups waiting';
        document.getElementById('todo').textContent = done ? '8 to do' : '11 to do';
      } }, 4.32);
      tl.fromTo('#r2', { backgroundColor: 'rgba(124,58,237,0)' }, { backgroundColor: 'rgba(124,58,237,0.28)', duration: 0.2 }, 4.3);
      tl.to('#approve', { opacity: 0, scale: 0.8, duration: 0.2, ease: 'power2.in' }, 4.36);
      tl.to('#cursor', { x: tap.x + 120, y: tap.y + 120, duration: 0.6, ease: 'power2.inOut' }, 4.6);
      // A member to watch floats in beside the list.
      tl.to('#needs', { scale: 0.85, opacity: 0, y: 30, duration: 0.3, ease: 'power2.in' }, 4.85);
      tl.fromTo('#watch', pop, popTo, 5.1);
      // Resolve: every piece flies back toward where it lives on the real screen, the dim lifts.
      tl.to('#cursor', { opacity: 0, duration: 0.25 }, 6.3);
      tl.to('#watch', { y: 120, scale: 0.6, opacity: 0, duration: 0.42, ease: 'power2.in' }, 6.5);
      tl.to('#dim i', { opacity: 0, duration: 0.45, ease: 'power2.inOut' }, 6.9);
      window.__timelines['owner'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

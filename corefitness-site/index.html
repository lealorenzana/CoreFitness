<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core Fitness — gym software for Philippine gyms</title>
    <meta
      name="description"
      content="Memberships, cash payments, QR check-in, classes and a phone app for your members. Built for a gym in Mamburao, and open to yours."
    />
    <meta property="og:title" content="Core Fitness — gym software for Philippine gyms" />
    <meta
      property="og:description"
      content="Memberships, cash payments, QR check-in, classes and a phone app for your members."
    />
    <meta name="theme-color" content="#0b0b12" />
    <!-- Light or dark before the first paint, so the page never flashes the other one:
         the visitor's own choice if they made one (src/theme.ts), else their device's. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('cf-site-theme'); } catch (e) { /* blocked storage: follow the device */ }
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f6f5fb' : '#0b0b12');
      })();
    </script>
    <meta property="og:image" content="/logo.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preload" as="image" href="/logo-320.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
